<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTS</title>
</head>
<body>

    <h2>Hitung Belanja</h2>

    <form>
        <label>Nama Pembeli</label><br>
        <input type="text" id="nama" placeholder="Masukkan nama"><br><br>

        <label>Harga Barang</label><br>
        <input type="number" id="harga" placeholder="Masukkan harga"><br><br>

        <label>Jumlah Barang</label><br>
        <input type="number" id="jumlah" placeholder="Masukkan jumlah"><br><br>

        <label>Status Pembeli</label><br>
        <select id="status">
            <option value="nonmember">Non Member</option>
            <option value="member">Member</option>
        </select><br><br>

        <button type="button" onclick="hitungTotal()">
            Hitung Total
        </button>
    </form>

    <h3>Hasil Perhitungan</h3>
    <div id="hasil"></div>

    <script src="script.js"></script>

</body>
</html>
